<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Cookies</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Bem-vindo ao site</h1>

        <p>
            Este é um conteúdo de exemplo da página,
            só pra dar contexto ao pop-up de cookies.
        </p>

    </main>

    <!-- POP-UP DE COOKIES -->

    <div id="popupCookies" style="display: none;" class="popup-cookies">

        <div class="popup-conteudo">

            <p class="popup-texto">

                Usamos cookies para melhorar sua experiência no site.
                Ao continuar navegando, você concorda com nossa
                <a href="#">Política de Privacidade</a>.

            </p>

            <div class="popup-botoes">

                <button id="botaoAceitar" class="botao-aceitar">
                    Aceitar
                </button>

                <button id="botaoRecusar" class="botao-recusar">
                    Não aceito
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
